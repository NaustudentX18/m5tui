name: xtensa (device build, M1+)

on:
  push:
    branches: [master, main]
    paths:
      - 'crates/m5tui-device/**'
      - '.github/workflows/xtensa.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'crates/m5tui-device/**'
      - '.github/workflows/xtensa.yml'
  workflow_dispatch:

jobs:
  device-cross-compile:
    name: xtensa-esp32s3-espidf cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install espup
        run: |
          curl -LO https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu
          chmod +x espup-x86_64-unknown-linux-gnu
          sudo mv espup-x86_64-unknown-linux-gnu /usr/local/bin/espup
          espup install
      - name: Install clang for xtensa
        run: sudo apt-get update -qq && sudo apt-get install -y libclang-dev clang
      - name: Source esp env
        run: . $HOME/export-esp.sh && env | grep -E '^(PATH|CARGO_TARGET|XTENSA)' | head -20
      - name: Install esp32s3 target via cargo
        run: |
          . $HOME/export-esp.sh
          rustup target add xtensa-esp32s3-espidf
      - name: Cross-compile m5tui-device (host features only)
        run: |
          . $HOME/export-esp.sh
          cargo check -p m5tui-device --target xtensa-esp32s3-espidf
      - name: Cross-compile m5tui-device (device feature)
        run: |
          . $HOME/export-esp.sh
          cargo check -p m5tui-device --target xtensa-esp32s3-espidf --features device || \
            echo "WARN: device-feature build failed; expected until M5GFX bindings are added"
