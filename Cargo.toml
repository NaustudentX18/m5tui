[workspace]
resolver = "2"
members = [
    "crates/m5tui-core",
    "crates/m5tui-bin",
    "crates/m5tui-themes",
    "crates/m5tui-ssh",
    "crates/m5tui-profile",
    "crates/m5tui-persist",
    "crates/m5tui-omp",
    "crates/m5tui-voice",
    "crates/m5tui-book",
    "crates/m5tui-market",
    "crates/m5tui-handoff",
    "crates/m5tui-device",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Forest Hudson"]
repository = "https://github.com/NaustudentX18/m5tui"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
